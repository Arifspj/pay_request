name: pay_request
description: "Payment Request App - Send UPI payment requests via WhatsApp"
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  mobile_scanner: ^6.0.7
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  provider: ^6.1.2
  flutter_contacts: ^2.1.0
  qr: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  path_provider_platform_interface: ^2.1.2

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#004AC6"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
    - assets/app_icon_foreground.png
    - assets/Pay-Using-Any-UPI-App.png.png
    - assets/upi_logo_icon.png
